<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Renault Clio - Painel & Telemetria</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Clio Telemetria" />

    <!-- Apple iOS Safari PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clio Telemetria" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- OpenStreetMap Leaflet Stylesheet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-[#050508] text-white antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isDev = window.location.hostname.includes('ais-dev') || window.location.hostname === 'localhost' || window.location.port === '3000';
          if (isDev) {
            // Clean up any stale service workers or caches that could cause duplicate React chunk conflicts
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const reg of registrations) {
                reg.unregister();
              }
            });
            if ('caches' in window) {
              caches.keys().then((names) => {
                for (const name of names) {
                  if (name.startsWith('clio-telemetria')) {
                    caches.delete(name);
                  }
                }
              });
            }
          } else {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.error('ServiceWorker registration error:', err);
            });
          }
        });
      }
    </script>
  </body>
</html>
